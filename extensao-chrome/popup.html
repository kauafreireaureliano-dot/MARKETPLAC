<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 380px; max-height: 500px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow-y: auto; }
    .header { background: #16213e; padding: 12px 16px; border-bottom: 2px solid #e94560; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 16px; color: #e94560; }
    .header .stats { font-size: 11px; color: #aaa; text-align: right; }
    .header .stats span { display: block; }
    .header .stats .num { color: #4ecca3; font-weight: bold; font-size: 14px; }
    .actions { padding: 8px 16px; display: flex; gap: 8px; background: #16213e; }
    .actions button { flex: 1; padding: 6px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-marketplace { background: #e94560; color: white; }
    .btn-limpar { background: #333; color: #aaa; }
    .btn-marketplace:hover { background: #c73652; }
    .btn-limpar:hover { background: #444; }
    .lista { padding: 8px; }
    .card { background: #16213e; border-radius: 6px; padding: 10px; margin-bottom: 6px; border-left: 3px solid #333; }
    .card.bom { border-left-color: #4ecca3; }
    .card .titulo { font-size: 12px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .card .info { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .card .preco { color: #4ecca3; font-weight: bold; font-size: 13px; }
    .card .desconto { background: #e94560; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
    .card .acima { color: #666; font-size: 10px; }
    .card .fipe { color: #888; font-size: 10px; margin-top: 2px; }
    .card a { display: block; text-align: center; margin-top: 6px; padding: 4px; background: #e94560; color: white; text-decoration: none; border-radius: 3px; font-size: 11px; font-weight: 600; }
    .card a:hover { background: #c73652; }
    .vazio { text-align: center; padding: 40px 20px; color: #666; }
    .vazio .emoji { font-size: 40px; margin-bottom: 10px; }
    .vazio p { font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚗 I9Car</h1>
    <div class="stats">
      <span>Encontrados: <span class="num" id="total">0</span></span>
      <span>Abaixo Fipe: <span class="num" id="abaixo">0</span></span>
    </div>
  </div>
  <div class="actions">
    <button class="btn-marketplace" id="btnMarketplace">Abrir Marketplace</button>
    <button class="btn-limpar" id="btnLimpar">Limpar</button>
  </div>
  <div class="lista" id="lista">
    <div class="vazio">
      <div class="emoji">🔍</div>
      <p>Abra o Facebook Marketplace e role a página.<br>A extensão coleta os carros automaticamente.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
